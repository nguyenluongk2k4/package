        - generic [ref=e47]: UNESCO vinh danh năm 2014 là di sản hỗn hợp đầu tiên tại Đông Nam Á.
    - region "Câu chuyện Tràng An" [ref=e48]:
      - generic [ref=e49]:
        - paragraph [ref=e50]: Tràng An
        - heading "Biểu tượng thiên nhiên, văn hóa của Ninh Bình" [level=2] [ref=e51]
        - generic [ref=e52]:
          - paragraph [ref=e53]: Nhưng Tràng An không chỉ đẹp bởi thiên nhiên. Vùng đất này còn gắn liền với lịch sử hình thành và phát triển của kinh đô Hoa Lư xưa. Trong thời kỳ nhà Đinh và nhà Tiền Lê, những dãy núi đá vôi hiểm trở cùng hệ thống sông ngòi tự nhiên đã trở thành bức tường thành vững chắc bảo vệ kinh đô đầu tiên của nước Đại Cồ Việt.
          - paragraph [ref=e54]: Trải nghiệm đặc biệt nhất tại Tràng An chính là hành trình ngồi thuyền len lỏi qua những dòng sông xanh ngọc bích, đi qua các hang động tự nhiên như Hang Sáng, Hang Tối, Hang Nấu Rượu hay Hang Địa Linh.
          - paragraph [ref=e55]: Không chỉ là điểm đến dành cho những người yêu thiên nhiên, Tràng An còn là nơi giúp du khách tìm lại sự bình yên giữa nhịp sống hiện đại. Tiếng mái chèo khẽ lướt trên mặt nước, tiếng chim hót vang vọng giữa núi rừng và khung cảnh yên bình của vùng đất cố đô khiến bất cứ ai đặt chân đến đây cũng muốn chậm lại.
          - paragraph [ref=e56]: Đối với Sắc Cố Đô, Tràng An không chỉ là một điểm đến, mà còn là nơi khởi đầu cho hành trình khám phá di sản. Mỗi con thuyền, mỗi hang động và mỗi câu chuyện lịch sử nơi đây đều là những dấu ấn đặc biệt, góp phần tạo nên ký ức khó quên trong lòng du khách khi đến với Ninh Bình.
