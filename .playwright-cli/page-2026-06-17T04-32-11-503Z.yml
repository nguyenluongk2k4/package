    - generic [ref=e37]:
      - article [ref=e38]:
        - paragraph [ref=e39]: Kỳ quan thiên nhiên
        - heading "Vịnh Hạ Long trên cạn - bản giao hưởng đá và nước" [level=2] [ref=e40]
        - paragraph [ref=e41]: Được UNESCO công nhận là Di sản Văn hóa và Thiên nhiên Thế giới vào năm 2014, Tràng An không chỉ là niềm tự hào của Ninh Bình mà còn là di sản hỗn hợp đầu tiên của Việt Nam được ghi danh vào Danh mục Di sản Thế giới.
        - paragraph [ref=e42]: Hàng triệu năm trước, nơi đây từng là vùng biển cổ rộng lớn. Trải qua sự biến đổi của địa chất và thời gian, thiên nhiên đã tạo nên một quần thể núi đá vôi kỳ vĩ cùng hệ thống hang động xuyên thủy độc đáo hiếm có trên thế giới.
        - paragraph [ref=e43]: Những dãy núi xanh trùng điệp soi bóng xuống dòng nước trong vắt đã tạo nên khung cảnh được nhiều du khách ưu ái gọi là Vịnh Hạ Long trên cạn.
        - link "Nhìn ngắm di sản" [ref=e44] [cursor=pointer]:
          - /url: "#thu-vien-anh"
      - figure "UNESCO vinh danh năm 2014 là di sản hỗn hợp đầu tiên tại Đông Nam Á." [ref=e45]:
